name: package

on:
  push:
    branches: [main]
    tags: ['v*', 'test']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道：stable = 正式（默认）；test = 内部测试通道（pre-release，正式通道看不到）'
        type: choice
        default: stable
        options: [stable, test]

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  RID: win-x64

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content MiHome.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value.Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: Restore
        run: dotnet restore MiHome.csproj -p:Configuration=Release
        shell: pwsh

      - name: Publish single-file exe
        shell: pwsh
        run: |
          if (-not $env:ProgramFiles) { $env:ProgramFiles = "C:\Program Files" }
          if (-not $env:ProgramW6432) { $env:ProgramW6432 = "C:\Program Files" }
          if (-not ${env:ProgramFiles(x86)}) { ${env:ProgramFiles(x86)} = "C:\Program Files (x86)" }
          .\scripts\publish-sc.ps1 -Rid $env:RID -Configuration Release

      - name: Build installer (self-contained shell + payload) + update manifest
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $ch = if ("${{ github.ref }}" -eq "refs/tags/test" -or "${{ inputs.channel }}" -eq "test") { "test" } else { "stable" }
          $expires = if ($ch -eq "test") { 30 } else { 0 }
          .\scripts\package-setup.ps1 -Rid $env:RID -Version $v -SkipMainPublish -Channel $ch -ExpiresDays $expires
          if ($LASTEXITCODE -ne 0) { throw "package-setup.ps1 failed" }

      - name: Collect artifacts + SHA256
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $releaseDir = Join-Path $PWD "publish\release\$v"
          $exe = Join-Path $PWD "publish\sc-$env:RID\MiHome.exe"
          $setup = Join-Path $releaseDir "MiHome-Setup-$v-$env:RID.exe"
          $manifest = Join-Path $releaseDir "update.json"
          if (-not (Test-Path -LiteralPath $exe)) { throw "published exe not found: $exe" }
          if (-not (Test-Path -LiteralPath $setup)) { throw "installer not found: $setup" }
          if (-not (Test-Path -LiteralPath $manifest)) { throw "update.json not found: $manifest" }

          Copy-Item -LiteralPath $exe -Destination (Join-Path $releaseDir "MiHome.exe") -Force
          # 校验清单只列实际发到 Release 的安装包：单文件 exe 只留在 CI artifact 里
          $lines = @()
          foreach ($f in @($setup)) {
            $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLowerInvariant()
            $lines += ("{0}  {1}" -f $h, (Split-Path -Leaf $f))
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $releaseDir "SHA256SUMS.txt"),
            [string[]]$lines,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-ChildItem -LiteralPath $releaseDir -File |
            ForEach-Object { Write-Host ("{0}  {1} MB" -f $_.Name, [math]::Round($_.Length / 1MB, 2)) }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiHome-${{ steps.ver.outputs.version }}-${{ env.RID }}
          path: publish/release/${{ steps.ver.outputs.version }}/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/release/${{ steps.ver.outputs.version }}/MiHome-Setup-${{ steps.ver.outputs.version }}-${{ env.RID }}.exe
            publish/release/${{ steps.ver.outputs.version }}/SHA256SUMS.txt
            publish/release/${{ steps.ver.outputs.version }}/update.json
          generate_release_notes: true

      # 测试通道：固定的滚动 tag 'test'，永远 pre-release；releases/latest 选不到它，
      # 所以正式用户即使拿着同样的 exe 也永远不会被引到测试版本（清单本身也带 channel=test）。
      - name: Publish to test channel (pre-release)
        if: github.ref == 'refs/tags/test' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'test')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = Join-Path $PWD "publish\release\$v"
          $files = @(
            (Join-Path $dir "MiHome-Setup-$v-$env:RID.exe"),
            (Join-Path $dir "SHA256SUMS.txt"),
            (Join-Path $dir "update.json")
          )
          gh release view test *> $null
          if ($LASTEXITCODE -ne 0) {
            if (-not (git tag --list test)) { git tag test }
            git push origin test
            gh release create test @files --title "MiHome 测试通道（内部验证）" --prerelease --notes "内部测试版本，正式通道不会分发。"
          } else {
            gh release upload test @files --clobber
            gh release edit test --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "test channel publish failed" }
